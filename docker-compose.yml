version: '3.8'

services:
  # 1. Main Express + Node.js Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alumix_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-alumni_db}
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-postgres}
      - PGPASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PGDATABASE=${POSTGRES_DB:-alumni_db}
      - PGSSL=false
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-prod_access_secret_alumni_system_key_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-prod_refresh_secret_alumni_system_key_2026}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - EMBEDDING_MODEL=Xenova/all-MiniLM-L6-v2
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 2. PostgreSQL 16 Source-of-Truth Database
  postgres:
    image: postgres:16-alpine
    container_name: alumix_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-alumni_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-alumni_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. Qdrant Vector Database Engine
  qdrant:
    image: qdrant/qdrant:latest
    container_name: alumix_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  pgdata:
    driver: local
  qdrant_storage:
    driver: local
