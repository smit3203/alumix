# Render Infrastructure as Code Blueprint
# AI-Powered Alumni Career Intelligence System

services:
  # 1. Main Node.js Web Application
  - type: web
    name: alumix
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && node db/run-seed.js
    startCommand: node app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alumix-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: Xenova/all-MiniLM-L6-v2

# 2. Managed PostgreSQL Cloud Database
databases:
  - name: alumix-db
    plan: free
    region: oregon
    databaseName: alumni_db
    user: alumni_user
